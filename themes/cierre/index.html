<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Cierre · Instructor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f0f0eb; color: #1a1a1a; line-height: 1.55;
      padding: 2rem 1.25rem 3rem;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    .badge {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: #92400e;
    }
    h1 { font-size: 1.45rem; font-weight: 700; margin: 0.35rem 0 0.5rem; }
    .warn {
      background: #fef3c7; border-left: 4px solid #f59e0b;
      padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.88rem;
      color: #78350f; margin: 1rem 0 1.5rem;
    }
    .row {
      display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;
      justify-content: space-between; background: #fff; border-radius: 10px;
      padding: 0.85rem 1rem; margin-bottom: 0.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .row .label { font-weight: 600; font-size: 0.9rem; }
    .row .hint { display: block; font-size: 0.75rem; color: #6b7280; font-family: ui-monospace, monospace; }
    a.btn {
      font: inherit; font-size: 0.78rem; font-weight: 600;
      padding: 0.4rem 0.75rem; border-radius: 6px; text-decoration: none;
      background: #c2410c; color: #fff;
    }
    footer { margin-top: 2rem; font-size: 0.8rem; color: #6b7280; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="badge">Instructor only · Cierre</p>
    <h1>Cierre</h1>
    <p class="warn">Examples only — not a full A/B leadership + coaching theme. Schema: <code>themes/WORKSHOP-SCHEMA.md</code>.</p>
    <div class="row">
      <div>
        <span class="label">Examples</span>
        <span class="hint">/cierre/examples/</span>
      </div>
      <a class="btn" href="examples/index.html">Abrir</a>
    </div>
    <footer>Source snapshot in <code>_source/</code>. Prefer full themes for monthly modules.</footer>
  </div>
</body>
</html>
